plugins {
    id 'com.android.application'
}

// az alkalmazás adatai: android/app.properties (név, azonosító, tájolás, háttérszín)
def cfg = new Properties()
new File(rootDir, 'app.properties').withReader('UTF-8') { cfg.load(it) }
// verzió: a workflow adja át a játékból (APP_VERSION), a build szám a GitHub futás sorszáma
def appVersion = System.getenv('APP_VERSION') ?: '1.0'
def buildNo = 1000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'hu.jatekok.app'
    compileSdk 34

    defaultConfig {
        applicationId cfg.getProperty('appId')
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName appVersion
        manifestPlaceholders = [
            appName    : cfg.getProperty('appName'),
            orientation: cfg.getProperty('orientation', 'unspecified')
        ]
        buildConfigField 'int', 'BG_COLOR', cfg.getProperty('bgColor', '0xFF000000')
        buildConfigField 'boolean', 'IMMERSIVE', cfg.getProperty('immersive', 'true')
        buildConfigField 'String', 'TTS_LANG', "\"${cfg.getProperty('ttsLang', 'hu-HU')}\""
    }

    // mindig ugyanaz a kulcs: így az új APK a régire telepíthető, és a mentés megmarad
    signingConfigs {
        release {
            storeFile file('../app.keystore')
            storePassword 'jatekapp'
            keyAlias 'app'
            keyPassword 'jatekapp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
