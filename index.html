<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0f0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metró Szim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:#0c0f0e}</style>
<title>M3 Metró Szimulátor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: teljes képernyős fekvő pálya; műszersor, kontroller és gombsor áttetsző rétegként a kép szélein. Álló telefonon az egész 90°-kal elfordul. */
:root{
  --bg:#0c0f0e; --glass:rgba(12,16,15,.74); --glass2:rgba(30,38,35,.85); --line:rgba(120,140,130,.28);
  --ink:#ebe5d1; --dim:#8b958e; --amber:#f3aa3c; --green:#56d68f; --red:#ff5a4b; --m3:#2a77cf;
  --display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);container:app/size}
@media (orientation:portrait) and (pointer:coarse){
  #app{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
#scene{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.menu{display:flex;flex-direction:column;gap:7px;justify-content:center}
.mbtn{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em;text-align:left;padding:11px 14px;border-radius:6px;border:1px solid #2f3a36;background:#202825;color:var(--ink);cursor:pointer}
.mbtn.pri{background:var(--amber);border-color:var(--amber);color:#1a1205}
.mbtn.quit{color:#ff8b7f;border-color:#5a2a25;background:#1d1514}
.mbtn small{display:block;font-size:12px;font-weight:500;color:inherit;opacity:.7}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sets{display:flex;flex-direction:column;gap:12px}
.set{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:13px}
.set>span:last-child{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.set input[type=range]{width:100%;accent-color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font-family:var(--display);font-size:14px;font-weight:600;padding:6px 10px;border-radius:4px;border:1px solid #2f3a36;background:#202825;color:var(--dim);cursor:pointer}
.seg button.on{background:#14263b;border-color:var(--m3);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-family:system-ui,sans-serif;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--amber);width:18px;height:18px}
.note{font-family:system-ui,sans-serif;font-size:12px;color:var(--dim);line-height:1.45}
.b.quit{color:#ff8b7f;border-color:#5a2a25}
.b.dir{display:flex;align-items:center;gap:3px;color:var(--green);border-color:#2a7a4e;min-width:58px;justify-content:center}
.b.dir svg{width:22px;height:22px;transition:transform .25s}
.b.dir span{font-family:var(--mono);font-size:11px}
.b.dir.rev{color:var(--amber);border-color:#9c6b20;background:#2a1f0e}
.b.dir.rev svg{transform:scaleX(-1)}
.b.sos{background:#7a1a12;border-color:#c0392b;color:#fff;font-family:var(--mono);font-weight:600;min-width:58px}
.b.sos.alert{animation:sos .7s steps(2) infinite}
@keyframes sos{0%{background:#7a1a12}50%{background:#e2382a}}
@media (prefers-reduced-motion:reduce){.b.sos.alert{animation:none;background:#e2382a}.b.dir svg{transition:none}}
@media (max-width:620px) and (orientation:landscape),(max-width:620px) and (pointer:fine){.set{grid-template-columns:110px minmax(0,1fr) auto}}
@container app (max-width:620px){.set{grid-template-columns:110px minmax(0,1fr) auto}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#hud{position:absolute;top:6px;left:16px;right:16px;height:42px;display:flex;align-items:center;gap:14px;padding:0 10px;white-space:nowrap;overflow:hidden}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#spd{font-family:var(--mono);font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;min-width:62px}
#spd small{font-size:10px;color:var(--dim);margin-left:3px}
.ars{display:flex;gap:3px}
.ars span{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;background:#101513;color:#3d4a44;border:1px solid #26302c}
.ars span.on{background:#123b26;color:var(--green);border-color:#2a7a4e;box-shadow:0 0 6px rgba(86,214,143,.35)}
.ars span.over{background:#4a1410;color:var(--red);border-color:#a3322a}
.col{display:flex;flex-direction:column;gap:1px;min-width:0}
#pre{font-size:11px;color:var(--amber);min-height:13px}
.st{flex:1;min-width:0}
#stName{font-size:16px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
#stName i{font-style:normal;font-size:11px;padding:0 4px;border-radius:3px;margin-right:5px;color:#fff;vertical-align:2px}
.row{display:flex;gap:9px;align-items:baseline;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.lamps{display:flex;gap:4px}
.lamp{font-size:10px;letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:#101513;color:#46524c;border:1px solid #26302c}
.lamp.r{background:#4a1410;color:#ff8b7f;border-color:#a3322a}
.lamp.g{background:#123b26;color:var(--green);border-color:#2a7a4e}
.lamp.a{background:#4a3410;color:var(--amber);border-color:#9c6b20}
#clock{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:760px) and (orientation:landscape),(max-width:760px) and (pointer:fine){.hideS{display:none!important}#hud{gap:10px}}
@container app (max-width:760px){.hideS{display:none!important}#hud{gap:10px}}
#toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(70%,520px)}
.toast{background:rgba(12,15,14,.88);border:1px solid var(--line);border-left:3px solid var(--amber);padding:4px 9px;border-radius:4px;font-size:14px;text-align:center;transition:opacity .4s}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}.toast.ann{border-left-color:var(--m3);font-style:italic}
#lever{position:absolute;right:16px;top:56px;bottom:56px;width:56px;display:flex;flex-direction:column-reverse;gap:3px;padding:4px}
#lever button{flex:1;min-height:0;border:1px solid #2c3632;border-radius:4px;background:rgba(18,23,21,.9);color:var(--dim);font-family:var(--display);font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:1px}
@media (max-height:600px){#lever button small{display:none}#lever button{font-size:15px}}
@container app (max-height:600px){#lever button small{display:none}#lever button{font-size:15px}}
#lever button small{font-size:8px;font-weight:500;letter-spacing:.06em;margin-top:2px;opacity:.8;text-transform:uppercase}
#lever button.x{color:#8fd8ac}#lever button.t{color:#efc07a}#lever button.vb{color:#ff8b7f}
#lever button.act{color:#0c0f0e;background:var(--ink);border-color:var(--ink)}
#lever button.act.x{background:var(--green);border-color:var(--green)}
#lever button.act.t{background:var(--amber);border-color:var(--amber)}
#lever button.act.vb{background:var(--red);border-color:var(--red)}
#bar{position:absolute;left:16px;right:16px;bottom:6px;height:42px;display:flex;gap:5px;align-items:center}
#prog{position:relative;flex:1;min-width:70px;height:40px}
#prog .track{position:absolute;left:8px;right:8px;top:14px;height:2px;background:var(--m3);opacity:.7}
#prog .dot{position:absolute;top:11px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--m3);box-sizing:border-box}
#prog .dot.done{background:currentColor}
#prog .nm{position:absolute;top:22px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog .trn{position:absolute;top:8px;width:10px;height:14px;margin-left:-5px;background:var(--amber);border-radius:2px;box-shadow:0 0 8px rgba(243,170,60,.6)}
.b{height:40px;min-width:44px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:var(--glass2);color:var(--ink);font-family:var(--display);font-size:14px;font-weight:600;cursor:pointer;flex:none}
.b.door{min-width:104px;background:#16304f;border-color:#2a5c94;font-size:15px}
.b.door.open{background:#5a2018;border-color:#a3322a}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:active{transform:translateY(1px)}
#ov{position:absolute;inset:0;background:rgba(6,8,8,.88);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:5}
#ov[hidden]{display:none!important}
.card{width:min(860px,100%);background:#171d1b;border:1px solid #2f3a36;border-radius:8px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px}
.card .full{grid-column:1/-1}
@media (max-width:620px) and (orientation:landscape),(max-width:620px) and (pointer:fine){.card{grid-template-columns:minmax(0,1fr)}}
@container app (max-width:620px){.card{grid-template-columns:minmax(0,1fr)}}
@container app (max-width:900px){.card.setc{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px) and (orientation:landscape),(max-width:900px) and (pointer:fine){.card.setc{grid-template-columns:minmax(0,1fr)}}
.card h1{margin:0;font-size:30px;line-height:1;text-wrap:balance}
.card h1 span{color:var(--m3)}
.card p{margin:0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.5;color:#c9c4b3;max-width:65ch}
.card img{width:100%;height:auto;display:block}
.mmw{position:relative;border-radius:6px;overflow:hidden;border:1px solid #2f3a36;background:#0d1214}
#mmc{display:block;width:100%;aspect-ratio:3.1/1}
@container app (max-height:460px){#mmc{aspect-ratio:4.2/1}}
#mmLab{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#f4efe0;background:rgba(10,12,12,.6);padding:2px 6px;border-radius:3px}
.mbtn.ic{display:flex;align-items:center;gap:12px}
.mbtn.ic>svg{width:26px;height:26px;flex:none;opacity:.92}
.mbtn.ic>span{min-width:0;display:flex;flex-direction:column}
.mbtn.ic small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn.acc{border-color:#2a5c94;background:#14263b}
.mbtn:hover{filter:brightness(1.08)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mbtn.sm{font-size:15px;padding:9px 10px;gap:8px}
.mbtn.sm>svg{width:20px;height:20px}
@container app (max-width:520px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rveh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid #2a5c94;border-radius:6px;background:#14263b;font-size:15px}
.rveh .b,.gbtns .b{display:inline-flex;align-items:center;gap:6px}.rveh svg,.gbtns svg{width:16px;height:16px}
.routes .tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;padding:0 5px;border-radius:3px;background:#3a2a10;color:var(--amber);margin-left:6px;vertical-align:2px}
.garc{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.garw{position:relative;border:1px solid #2f3a36;border-radius:6px;overflow:hidden;background:#0d1214}
#gcv{display:block;width:100%;aspect-ratio:3.4/1;touch-action:pan-y;cursor:pointer}
@container app (max-height:460px){#gcv{aspect-ratio:4.4/1}}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:58px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,14,.55);color:#fff;font-size:32px;line-height:1;cursor:pointer}
.gnav.l{left:8px}.gnav.r{right:8px}
.gnav:active{transform:translateY(-50%) scale(.94)}
.gdots{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:8px}
.gdots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}.gdots i.on{background:var(--amber)}
.ginfo{display:flex;flex-direction:column;gap:6px;min-width:0}.ginfo h2{margin:0;font-size:25px;line-height:1}
.ginfo dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:2px 0;font-family:var(--mono);font-size:11.5px}.ginfo dt{color:var(--dim)}.ginfo dd{margin:0}
.gbtns{display:flex;gap:6px;flex-wrap:wrap}.b.on{background:#4a3410;border-color:var(--amber);color:var(--amber)}
.gside{display:flex;flex-direction:column;gap:8px;min-width:0}
.gstep{display:flex;align-items:center;gap:8px;font-size:16px;flex-wrap:wrap}.gstep b{font-family:var(--mono);font-size:20px;min-width:28px;text-align:center}.gstep .b{width:44px;font-size:20px}.gstep .b:disabled{opacity:.35}
.groutes{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-height:200px;overflow:auto}
.mbtn.hist{border-color:#7a5a2a;background:#2a2112}
.tl{position:relative;height:96px;margin:6px 10px 0}
.tlbar{position:absolute;left:0;right:0;top:40px;height:4px;border-radius:2px;background:linear-gradient(90deg,#3a3f3c,#7a5a2a 50%,#8a2a20)}
.tly{position:absolute;top:80px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--dim)}
.tlm{position:absolute;top:10px;transform:translateX(-50%);background:none;border:0;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 2px}
.tlm i{order:2;width:16px;height:16px;border-radius:50%;background:#171d1b;border:3px solid var(--amber);margin-top:2px}
.tlm b{order:1;font-family:var(--mono);font-size:10px;font-weight:500;white-space:nowrap;background:#171d1b;padding:1px 4px;border-radius:3px}
.tlm.dn{top:31px}.tlm.dn i{order:1}.tlm.dn b{order:2}
.tlm.on i{background:var(--amber);box-shadow:0 0 10px rgba(243,170,60,.7)}.tlm.on b{color:var(--amber)}
.hcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px 18px;border:1px solid #2f3a36;border-radius:6px;padding:12px;background:#121715}
.hhead h2{margin:2px 0;font-size:24px}.hcard canvas{display:block;width:100%;height:60px;align-self:end}
.htxt{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;max-width:80ch}.htxt h3{margin:6px 0 0;font-size:15px;letter-spacing:.04em;color:var(--amber)}
.htxt p,.htxt li{font-family:system-ui,sans-serif;font-size:13px;line-height:1.5;color:#c9c4b3;margin:0}.htxt ul{margin:0;padding-left:18px}.htxt a{color:#8fc0ff}
@container app (max-width:620px){.hcard{grid-template-columns:minmax(0,1fr)}}
.grp{margin:2px 0 -6px;font-size:17px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.routes button canvas{display:block;width:100%;height:34px;margin-bottom:5px}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.routes button{text-align:left;border:1px solid #2f3a36;background:#202825;color:var(--ink);border-radius:6px;padding:7px 9px;cursor:pointer;font-family:var(--display)}
.routes button b{display:block;font-size:16px}
.routes button span{font-size:12px;color:var(--dim)}
.routes button.sel{border-color:var(--m3);box-shadow:inset 0 0 0 1px var(--m3);background:#14263b}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:13px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.go{font-family:var(--display);font-size:20px;font-weight:700;padding:10px;border-radius:6px;border:0;background:var(--amber);color:#1a1205;cursor:pointer}
.help{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:system-ui,sans-serif;font-size:12px;color:#c9c4b3;align-content:start}
.help b{font-family:var(--mono);font-size:11px;color:var(--ink);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;border-bottom:1px solid #2f3a36;text-align:right}
td:first-child,th:first-child{text-align:left;font-family:var(--display);font-size:14px}
th{color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.tblw{overflow:auto;max-height:50vh}
.big{font-family:var(--mono);font-size:38px;font-weight:600}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* telepítési varázsló: álló és fekvő telefonon is, világos és sötét témában */
#wiz{--wbg:#f3f1ea;--wpanel:#ffffff;--wink:#1b1f1d;--wdim:#5d6661;--wline:#d8d4c8;--wacc:#1f63b8;--waccink:#fff;--wsec:#e9e6dd;--wcode:#f7f5ef;
  position:fixed;inset:0;z-index:50;background:var(--wbg);color:var(--wink);overflow:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(90px + env(safe-area-inset-bottom,0px));box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:text;user-select:text}
@media (prefers-color-scheme:dark){#wiz{--wbg:#0c0f0e;--wpanel:#171d1b;--wink:#ebe5d1;--wdim:#9aa39c;--wline:#2f3a36;--wacc:#3d8bff;--waccink:#071223;--wsec:#222a27;--wcode:#0f1312}}
#wiz[hidden]{display:none!important}
html.wiz-open #app{visibility:hidden}
.wz-panel{width:min(520px,100%);background:var(--wpanel);border:1px solid var(--wline);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.wz-panel h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.05;text-wrap:balance}
.wz-panel p{margin:0;font-size:16px;line-height:1.5}
.wz-ico{font-size:44px;line-height:1}
.wz-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 16px;border-radius:10px;border:0;background:var(--wacc);color:var(--waccink);font-family:var(--display);font-size:21px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.wz-btn.wz-sec{background:var(--wsec);color:var(--wink);border:1px solid var(--wline)}
.wz-btn.wz-small{min-height:44px;font-size:16px;padding:0 14px}
.wz-link{background:none;border:0;color:var(--wacc);font-size:15px;padding:10px 4px;cursor:pointer;min-height:44px;text-align:left}
.wz-link:last-child{text-align:right}
.wz-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--wline);padding-top:4px}
.wz-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wz-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 8px;min-height:120px;border-radius:12px;border:2px solid var(--wline);background:var(--wsec);color:var(--wink);font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer}
.wz-card .wz-big{font-size:42px;line-height:1}
.wz-card.wz-me{border-color:var(--wacc);box-shadow:0 0 0 3px color-mix(in srgb,var(--wacc) 25%,transparent)}
.wz-card em{font-style:normal;font-family:system-ui,sans-serif;font-size:12px;font-weight:600;background:var(--wacc);color:var(--waccink);padding:2px 8px;border-radius:999px}
.wz-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.wz-steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45}
.wz-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--wacc);color:var(--waccink);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono)}
.wz-i{display:inline-flex;vertical-align:middle;color:var(--wacc);margin-left:4px}
.wz-note{font-size:13px!important;color:var(--wdim)}
.wz-code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--wline);border-radius:10px;background:var(--wcode)}
.wz-code b{display:block;font-family:var(--mono);font-size:22px;letter-spacing:.06em}
.wz-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--wdim)}
.wz-linkbox{font-family:var(--mono);font-size:14px;padding:10px;border:1px solid var(--wline);border-radius:8px;background:var(--wcode);word-break:break-all}
.wz-arrow{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:46px;line-height:1;color:var(--wacc);animation:wzb 1.1s ease-in-out infinite;pointer-events:none}
@keyframes wzb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){.wz-arrow{animation:none}}
#wiz button:focus-visible,#wiz a:focus-visible{outline:3px solid var(--wacc);outline-offset:2px}

</style>

      g.strokeStyle='#202325';g.lineWidth=.06;g.beginPath();g.moveTo(ax-s*r*.55,fy+fh*.15);g.lineTo(ax-s*r*.85,y-r*.15);g.stroke();g.strokeStyle='#8a8f92';g.lineWidth=.02;g.beginPath();g.moveTo(ax-s*r*.57,fy+fh*.2);g.lineTo(ax-s*r*.7,fy+fh*.55);g.stroke()}

  g.fillStyle='rgba(0,0,0,.05)';for(let y=y0+.25;y<y1-.2;y+=.16)g.fillRect(x0,y,x1-x0,.012);

// a kész vásznat képpé alakítjuk (a telefon háttérben törölheti a rejtett vásznakat), és elkészül a sötét változat is
function vFinish(c){const out={cv:c,img:null,dk:null};
  try{const im=new Image();im.onload=()=>out.img=im;im.src=c.toDataURL('image/png');
    const d=document.createElement('canvas');d.width=c.width;d.height=c.height;const x=d.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(6,10,14,.42)';x.fillRect(0,0,d.width,d.height);
    const dm=new Image();dm.onload=()=>out.dk=dm;dm.src=d.toDataURL('image/png');out.dcv=d}catch(e){}
  return out}

  const rem=(d,dv)=>{const r=new Array(dv.length).fill(0);for(const b of d){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f))}return r};

    put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);

function showUpdate(back){
  ovShow(`<div class="card">${head('Frissítés','jelenlegi: v'+APP_VER)}

   <button class="mbtn" id="upBack">Vissza</button><button class="mbtn pri" id="upGo" hidden>Letöltés és újraindítás</button></div>`);
  $('upBack').onclick=back;const msg=t=>{const e=$('upMsg');if(e)e.textContent=t};
  const isApp=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
  if(!/vercel\.app$/.test(location.hostname)&&!isApp){msg('Ez az előnézeti változat mindig a legfrissebb verziót mutatja. A telepített app a m3metro.vercel.app címről frissül.');return}
  if(!navigator.onLine){msg('Nincs internetkapcsolat. Csatlakozz netre, és próbáld újra – addig az eltárolt verzió fut offline.');return}
  fetch('./index.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(async h=>{const m=h.match(/APP_VER='([^']+)'/),nv=m?m[1]:null;
    if(!nv){msg('Nem sikerült ellenőrizni a verziót. Próbáld újra később.');return}
    if(nv===APP_VER){msg('A legfrissebb verzió fut (v'+APP_VER+').');return}
    msg('Új verzió érhető el: v'+nv+'. Letöltés után a játék újraindul, a beállításaid megmaradnak.');const b=$('upGo');b.hidden=false;
    b.onclick=async()=>{b.disabled=true;msg('Letöltés…');try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('metro-szim')).map(k=>caches.delete(k)))}}catch(e){}
      location.reload()}}).catch(()=>msg('A szerver nem érhető el. Próbáld újra később.'));
}
function offlineStatus(){const el=$('offl');if(!el)return;
  const sw=navigator.serviceWorker;if(!sw||!window.caches){el.textContent='';return}
  if(!sw.controller){el.style.color='var(--dim)';el.textContent=/vercel\.app$/.test(location.hostname)?'· offline mód előkészítése…':'';return}
  caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('metro-szim')).map(k=>caches.open(k).then(c=>c.match('./index.html'))))).then(r=>{
    if(r.some(Boolean)){el.style.color='var(--green)';el.textContent=navigator.onLine?'· offline is játszható':'· offline mód'}
    else{el.style.color='var(--dim)';el.textContent='· offline mód előkészítése…';try{sw.controller.postMessage('precache')}catch(e){}}}).catch(()=>{})}

   <b>↑ / ↓</b><span>kontroller fel / le</span><b>Szóköz</b><span>ajtók nyitása / zárása</span><b>H</b><span>kürt</span><b>R / nyíl ikon</b><span>irányváltó álló helyzetben; a nyíl mutatja a menetirányt (zöld: előre, sárga: hátra)</span><b>112</b><span>segélyhívás vészhelyzetben (személy a vágányon)</span><b>Esc / P</b><span>szünet menü</span></div>
   <div class="help"><b>C / Kamera</b><span>nézet: Menet → Fülke → Szerelvény → Hátra</span><b>+ / −, csippentés</b><span>nagyítás, kicsinyítés</span><b>húzás</b><span>a kép elmozgatása előre-hátra</span><b>dupla koppintás</b><span>vissza a vonathoz</span><b>egérgörgő</b><span>nagyítás</span></div>
   <p class="full">Állj meg a megállási jelnél, nyisd ki az ajtókat, várd meg az utascserét, zárd az ajtókat, és indulj a menetrend szerinti időben. A metróban a sebességet az ARS, a felszíni vasúton az EVM felügyeli; a sárga táblán a lassújel sebessége áll tízes egységben (6 = 60 km/h).</p>
   <p class="full">Felszíni vasút: a vonatok nehezebbek, lassabban gyorsulnak és fékeznek – kezdd el időben a fékezést. Tehervonattal a megállási jelnél a Megállás gombbal jelentkezz, majd a menetrend szerinti időben az Indulás gombbal indulj. A forgalmi szolgálattevő zöld tárcsával jelzi, ha indulhatsz. Vasúti átjáró előtt adj hangjelzést a kürttel (H) – ezért +10 pont jár. Ha egy autó behajt vagy a sínen ragad, fékezz; a kürtszóra a sofőr megállhat vagy lehajthat. Ütközés után hívd a 112-t. A bejárati jelző előtt előjelző áll; a lassújel előtt sárga háromszög figyelmeztet.</p>
   <button class="mbtn full" id="hBack">Vissza</button></div>`);
  $('hBack').onclick=back;
}
const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,t])=>`<button data-v="${v}" class="${v===val?'on':''}">${t}</button>`).join('')}</div>`;
function bindSeg(id,fn){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)})}
function showSettings(back){
  ovShow(`<div class="card setc">${head('Beállítások','automatikusan mentve')}
   <div class="sets">
    <div class="set"><label for="sVol">Hangerő</label><input type="range" id="sVol" min="0" max="100" value="${cfg.vol}"><span id="sVolV">${cfg.vol}</span></div>
    <div class="set"><span>Bemondó</span>${seg('sVoice',[['retro','Retro férfi'],['normal','Normál'],['off','Ki']],cfg.voice)}<span></span></div>
    <div class="set"><label for="sVv">Bemondó hangereje</label><input type="range" id="sVv" min="0" max="100" value="${cfg.vvol}"><span id="sVvV">${cfg.vvol}</span></div>
    <div class="set"><span></span><button class="b" id="sTest" style="justify-self:start">Próbabemondás</button><span></span></div>
    <div class="set"><span>Jelzőhang</span>${seg('sCh',[['gong','Retro gong'],['custom','Saját fájl'],['none','Nincs']],cfg.chime)}<span></span></div>
    <div class="set"><span></span><div style="display:flex;gap:6px;flex-wrap:wrap"><label class="b" for="sChF" style="display:inline-flex;align-items:center;cursor:pointer">Hangfájl feltöltése</label><input type="file" id="sChF" accept="audio/*" hidden><button class="b" id="sChT">Lejátszás</button></div><span id="sChS"></span></div>
    <p class="note">Saját jelzőhangként bármilyen hangfájlt betölthetsz (mp3, wav, max. 1,5 MB), például a BKV által letölthetőként közzétett jelzőhangot. Csak a te eszközödön tárolódik.</p>
    <p class="note">A retro bemondó mély, lassú férfihangon szól, hangszórós zúgással. A hang a telefon magyar felolvasóhangjából készül.</p>
   </div>
   <div class="sets">
    <div class="set"><span>Nehézség</span>${seg('sDiff',Object.entries(DIFF).map(([k,v])=>[k,v.n]),cfg.diff)}<span></span></div>
    <p class="note" id="sDiffD">${DIFF[cfg.diff].d}</p>
    <div class="set"><span>Alap kameranézet</span>${seg('sCam',CAMS.map(c=>[c,CAMN[c]]),cfg.cam)}<span></span></div>
    <div class="set"><span>Vészhelyzetek</span>${seg('sEm',Object.entries(EMERG).map(([k,v])=>[k,v[0]]),cfg.emerg)}<span></span></div>
    <p class="note">Ritkán egy utas a vágányra esik. Fékezz, hívd a 112-t, a mentők és a tűzoltók 5 s múlva érkeznek.</p>
    <label class="chk"><input type="checkbox" id="sShort" ${cfg.short?'checked':''}> Rövidített szakaszok (×0,6) – új menettől</label>
    <div class="set"><span>Grafika</span>${seg('sGfx',[['high','Részletes'],['eco','Takarékos']],cfg.gfx)}<span></span></div>
    <p class="note">Takarékos: kisebb felbontás, kevesebb effekt – gyengébb telefonon simábban fut, kevésbé melegszik.</p>
    <label class="chk"><input type="checkbox" id="sSpark" ${cfg.sparks?'checked':''}> Szikra- és íveffektek</label>
    <label class="chk"><input type="checkbox" id="sSway" ${cfg.sway?'checked':''}> Szerelvény rugózása (sínillesztések, fékezés)</label>
    <label class="chk"><input type="checkbox" id="sVib" ${cfg.vib?'checked':''}> Rezgés (vészfék, ARS, ív)</label>
    <button class="b" id="sFs" style="align-self:start">Teljes képernyő</button>
   </div>
   <button class="mbtn full" id="sBack">Vissza</button></div>`);
  $('sVol').oninput=e=>{cfg.vol=+e.target.value;$('sVolV').textContent=cfg.vol;if(A.master)A.master.gain.value=cfg.vol/100*.9;saveCfg()};
  $('sVv').oninput=e=>{cfg.vvol=+e.target.value;$('sVvV').textContent=cfg.vvol;saveCfg()};
  bindSeg('sVoice',v=>{cfg.voice=v;saveCfg()});
  bindSeg('sGfx',v=>{cfg.gfx=v;saveCfg();resize()});
  bindSeg('sEm',v=>{cfg.emerg=v;saveCfg()});
  bindSeg('sDiff',v=>{cfg.diff=v;$('sDiffD').textContent=DIFF[v].d;saveCfg()});
  bindSeg('sCam',v=>{cfg.cam=v;setCam(v);saveCfg()});
  $('sShort').onchange=e=>{cfg.short=e.target.checked;saveCfg()};
  $('sSpark').onchange=e=>{cfg.sparks=e.target.checked;saveCfg()};
  $('sSway').onchange=e=>{cfg.sway=e.target.checked;saveCfg()};
  bindSeg('sCh',v=>{cfg.chime=v;saveCfg()});
  let has=!!A.chimeData;if(!has)try{has=!!localStorage.getItem('m3sim.chime')}catch(e){}$('sChS').textContent=has?'van':'–';
  $('sChT').onclick=()=>{aInit();A.ctx.resume();loadChime();setTimeout(playChime,A.chimeBuf?0:300)};
  $('sChF').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.5e6)return toast('Túl nagy fájl (max. 1,5 MB)','bad');
    const r=new FileReader();r.onload=()=>{aInit();A.ctx.resume();A.chimeData=r.result;A.chimeBuf=null;
      try{localStorage.setItem('m3sim.chime',r.result)}catch(err){toast('A hang csak a mostani munkamenetben marad meg')}
      A.ctx.decodeAudioData(b64ToBuf(r.result)).then(b=>{A.chimeBuf=b;cfg.chime='custom';saveCfg();$('sChS').textContent='van';
        $('sCh').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='custom'));playChime();toast('Jelzőhang betöltve','good')})
      .catch(()=>toast('Ez a fájl nem olvasható hangként','bad'))};r.readAsDataURL(f)};
  $('sVib').onchange=e=>{cfg.vib=e.target.checked;saveCfg();vib(60)};
  $('sTest').onclick=()=>{aInit();A.ctx.resume();speak('Kérjük, vigyázzanak, az ajtók záródnak! A következő állomás: Deák Ferenc tér.')};
  $('sFs').onclick=goFull;
  $('sBack').onclick=back;
}
function goFull(){const el=document.documentElement;const p=el.requestFullscreen?el.requestFullscreen():Promise.reject();
  p.then(()=>screen.orientation&&screen.orientation.lock?screen.orientation.lock('landscape').catch(()=>{}):0).catch(()=>toast('A teljes képernyő itt nem érhető el'))}
function showRoutes(){
  freeze();const nw=new Date(),Dn=dayInfo(nw.getHours()*3600+nw.getMinutes()*60);
  const btn=(r,i)=>`<button data-i="${i}" class="${i===cfg.route?'sel':''}">${r.veh?`<canvas data-r="${i}" aria-hidden="true"></canvas>`:''}<b>${r.n}${r.long?'<span class="tag">hosszú</span>':''}</b><span>${r.d} · ${routeLen(r)} ${r.veh?'megálló':'állomás'}${r.veh?` · ${Math.round(routeKm(r)*(cfg.short?.6:1))} km`:''}</span></button>`;
  const grp=(t,k,sub)=>`<h2 class="full grp">${t}${sub?` <span class="sub">${sub}</span>`:''}</h2><div class="routes full">${ROUTES.map((r,i)=>routeKind(r)===k?btn(r,i):'').join('')}</div>`;
  ovShow(`<div class="card">${head('Új menet','útvonal')}
   <div class="full rveh"><span>Jármű: <b id="rv">${pickLabel(ROUTES[cfg.route])}</b></span><button class="b" id="rVeh">${ico('train')}Járműcsere</button></div>
   ${grp('Metró','metro')}${grp('Személyvonat','pass',Dn.part+' – a táj a napszakot követi')}${grp('Tehervonat','freight')}${grp('II. világháború','ww2','részletek az Idővonalon')}
   <p class="full note">Nehézség: ${DIFF[cfg.diff].n} · Szakaszok: ${cfg.short?'rövidített (×0,6)':'valós hossz'} · Bemondó: ${{retro:'retro férfi',normal:'normál',off:'ki'}[cfg.voice]} — a Beállításokban módosítható.</p>
   <button class="mbtn" id="rBack">Vissza</button><button class="mbtn pri" id="go">Indulás</button></div>`);
  const bs=ov.querySelectorAll('.routes button');bs.forEach(b=>b.onclick=()=>{cfg.route=+b.dataset.i;saveCfg();bs.forEach(x=>x.classList.toggle('sel',x===b));$('rv').textContent=pickLabel(ROUTES[cfg.route])});
  ov.querySelectorAll('.routes canvas').forEach(c=>drawThumb(c,consistKeys(ROUTES[+c.dataset.r])));
  $('rVeh').onclick=()=>showGarage(showRoutes);$('rBack').onclick=showMain;$('go').onclick=startGame;
}
function startGame(){
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
  aInit();clearTimeout(window.__spk);$('toasts').innerHTML='';reset();S.started=true;setCam(cfg.cam);cam.sw=false;cam.d=0;resume();updDoorBtn();
  try{speechSynthesis.getVoices()}catch(e){}
  if(R.freight)toast(`Tehervonat ${R.st[R.n-1].n} felé – indulás a menetrend szerint az Indulás gombbal`,'good');
  else if(R.rail)window.__spk=setTimeout(()=>speak(`Üdvözöljük utasainkat. A vonat ${R.st[R.n-1].n} állomásig közlekedik. A következő megálló: ${R.st[1].n}.`),400);
  else window.__spk=setTimeout(()=>speak(`${R.st[0].n}. Az ajtók zárása után a következő állomás: ${R.st[1].n}.`),400);
}
function showEnd(){
  freeze();lastScore[cfg.route]=Math.max(lastScore[cfg.route]||0,S.score);
  const chl=CHALLENGE&&CHALLENGE.r===cfg.route&&CHALLENGE.p>0?`<p class="full" id="chRes" style="font-size:16px;color:${S.score>CHALLENGE.p?'var(--green)':'var(--amber)'}">Kihívás (${CHALLENGE.p} pont): ${S.score>CHALLENGE.p?'megdöntötted! Küldd vissza a Megosztással.':'most nem sikerült – próbáld újra.'}</p>`:'';
  const max=(R.n-1)*160,pct=clamp(S.score/max,0,1),stars=pct>.85?'★★★':pct>.6?'★★☆':pct>.3?'★☆☆':'☆☆☆';
  const rows=S.log.map(l=>`<tr><td>${R.st[l.i].n}</td><td>${l.miss?'kimaradt':(l.late>=0?'+':'−')+mmss(l.late)}</td><td>${l.miss?'–':Math.abs(l.off).toFixed(1)+' m'}</td><td>${l.dep===undefined?'–':(l.dep>=0?'+':'−')+mmss(l.dep)}</td><td>${l.pts}</td></tr>`).join('');
  ovShow(`<div class="card"><div class="full" style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap"><h1>${R.name} – menet vége</h1><span class="big">${S.score}</span><span style="font-size:26px;color:var(--amber)">${stars}</span><span class="lbl">max. ${max} pont · ${DIFF[cfg.diff].n}</span></div>${chl}
  <div class="tblw full"><table><thead><tr><th>Állomás</th><th>Érkezés</th><th>Megállás</th><th>Indulás</th><th>Pont</th></tr></thead><tbody>${rows}${S.events.map(e=>`<tr><td>${e[0]}</td><td></td><td></td><td></td><td>${e[1]>0?'+':''}${e[1]}</td></tr>`).join('')}</tbody></table></div>
  <button class="mbtn pri" id="again">Újra ezt a vonalat</button><button class="mbtn" id="eRoutes">Másik útvonal</button><button class="mbtn full" id="eMain">Főmenü</button></div>`);
  $('again').onclick=startGame;$('eRoutes').onclick=showRoutes;$('eMain').onclick=()=>{reset();showMain()};
}

/* ---------- vezérlés ---------- */
$('bDoor').onclick=doorBtn;
const hb=$('bHorn');hb.addEventListener('pointerdown',e=>{e.preventDefault();if(!paused){aInit();hornOn()}});['pointerup','pointerleave','pointercancel'].forEach(t=>hb.addEventListener(t,hornOff));
function toggleDir(){if(paused)return;if(S.v>.05)return toast('Irányváltás csak álló helyzetben');if(S.lever>N0)return toast('Előbb állítsd a kontrollert 0 vagy fék állásba');S.dir*=-1;sLever();toast(S.dir>0?'Irány: előre':'Irány: hátra (max. 7 km/h)')}
$('bDir').onclick=toggleDir;$('b112').onclick=call112;
function nextCam(){const m=CAMS[(CAMS.indexOf(cam.mode)+1)%CAMS.length];setCam(m);toast('Kamera: '+CAMN[m])}
$('bCam').onclick=nextCam;
$('bZin').onclick=()=>setZoom(cam.z[cam.mode]*1.25);$('bZout').onclick=()=>setZoom(cam.z[cam.mode]/1.25);
$('bMenu').onclick=()=>{if(inGame()&&!paused)showPause()};
$('bQuit').onclick=()=>{if(!inGame())return;freeze();showConfirm(resume,exitToMain,'Kilépés','Kilépsz a menetből? A jelenlegi menet és pontjai elvesznek.')};
// csippentés, húzás, dupla koppintás, görgő
const ptrs=new Map();let pinch0=null,drag0=null,lastTap=0;
const rotated=()=>matchMedia('(orientation:portrait) and (pointer:coarse)').matches;
const appX=e=>rotated()?e.clientY:e.clientX;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0={d:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),z:cam.z[cam.mode]};drag0=null}
  else if(ptrs.size===1){drag0={x:appX(e),off:cam.off,moved:false};const now=performance.now();if(now-lastTap<300){cam.sw=true;cam.off=0}lastTap=now}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){const[a,b]=[...ptrs.values()];setZoom(pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d)}
  else if(drag0){const dx=appX(e)-drag0.x;if(Math.abs(dx)>6)drag0.moved=true;if(drag0.moved)cam.off=clamp(drag0.off-dx/ppmNow,-600,600)}});
const pUp=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(ptrs.size===0)drag0=null};
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,pUp));
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(cam.z[cam.mode]*(e.deltaY<0?1.12:1/1.12))},{passive:false});
addEventListener('keydown',e=>{if(!S)return;const k=e.key;
  if(k==='Escape'||k==='p'||k==='P'){if(inGame()){if(ov.hidden)showPause();else if($('pCont'))resume()}return}
  if(!ov.hidden)return;
  if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(!paused){aInit();setLever(S.lever+1)}}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();if(!paused){aInit();setLever(S.lever-1)}}
  else if(/^[0-4]$/.test(k)){if(!paused){aInit();setLever(N0+ +k)}}
  else if(k===' '){e.preventDefault();if(!e.repeat)doorBtn()}
  else if(k==='h'||k==='H'){if(!e.repeat&&!paused){aInit();hornOn()}}
  else if(k==='r'||k==='R')toggleDir();
  else if(k==='c'||k==='C')nextCam();
  else if(k==='j'||k==='J'){if(!paused)timeJump()}
  else if(k==='+'||k==='=')setZoom(cam.z[cam.mode]*1.25);else if(k==='-')setZoom(cam.z[cam.mode]/1.25)});
addEventListener('keyup',e=>{if(e.key==='h'||e.key==='H')hornOff()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(inGame()&&!paused)showPause()}else{resize();if(!sprOK(img)){img.src=CAR_IMG}}});
cv.addEventListener('contextrestored',resize);addEventListener('pageshow',resize);

let last=performance.now();
let audT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!ov.hidden)try{menuScene();garScene()}catch(e){}
  if(S){if(!paused){const eb=step(dt);audT-=dt;if(audT<=0){audT=1/25;audioUpdate(eb)}}render(dt);hudT-=dt;if(hudT<=0){updHud();hudT=.08}}
  requestAnimationFrame(frame)}
for(const k in ESC)delete ESC[k];reset();resize();setCam(cam.mode);showMain();bootDeepLink();requestAnimationFrame(frame);
</script>

<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{navigator.serviceWorker.ready.then(()=>{try{offlineStatus()}catch(e){}})}).catch(()=>{}));</script>
