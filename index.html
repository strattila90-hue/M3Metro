<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0f0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metró Szim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:#0c0f0e}</style>
<title>M3 Metró Szimulátor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: teljes képernyős fekvő pálya; műszersor, kontroller és gombsor áttetsző rétegként a kép szélein. Álló telefonon az egész 90°-kal elfordul. */
:root{
  --bg:#0c0f0e; --glass:rgba(12,16,15,.74); --glass2:rgba(30,38,35,.85); --line:rgba(120,140,130,.28);
  --ink:#ebe5d1; --dim:#8b958e; --amber:#f3aa3c; --green:#56d68f; --red:#ff5a4b; --m3:#2a77cf;
  --display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
@media (orientation:portrait) and (pointer:coarse){
  #app{inset:auto;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
}
#scene{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.menu{display:flex;flex-direction:column;gap:7px;justify-content:center}
.mbtn{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em;text-align:left;padding:11px 14px;border-radius:6px;border:1px solid #2f3a36;background:#202825;color:var(--ink);cursor:pointer}
.mbtn.pri{background:var(--amber);border-color:var(--amber);color:#1a1205}
.mbtn.quit{color:#ff8b7f;border-color:#5a2a25;background:#1d1514}
.mbtn small{display:block;font-size:12px;font-weight:500;color:inherit;opacity:.7}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sets{display:flex;flex-direction:column;gap:12px}
.set{display:grid;grid-template-columns:150px minmax(0,1fr) 42px;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:13px}
.set>span:last-child{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.set input[type=range]{width:100%;accent-color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font-family:var(--display);font-size:14px;font-weight:600;padding:6px 10px;border-radius:4px;border:1px solid #2f3a36;background:#202825;color:var(--dim);cursor:pointer}
.seg button.on{background:#14263b;border-color:var(--m3);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-family:system-ui,sans-serif;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--amber);width:18px;height:18px}
.note{font-family:system-ui,sans-serif;font-size:12px;color:var(--dim);line-height:1.45}
.b.quit{color:#ff8b7f;border-color:#5a2a25}
.b.dir{display:flex;align-items:center;gap:3px;color:var(--green);border-color:#2a7a4e;min-width:58px;justify-content:center}
.b.dir svg{width:22px;height:22px;transition:transform .25s}
.b.dir span{font-family:var(--mono);font-size:11px}
.b.dir.rev{color:var(--amber);border-color:#9c6b20;background:#2a1f0e}
.b.dir.rev svg{transform:scaleX(-1)}
.b.sos{background:#7a1a12;border-color:#c0392b;color:#fff;font-family:var(--mono);font-weight:600;min-width:58px}
.b.sos.alert{animation:sos .7s steps(2) infinite}
@keyframes sos{0%{background:#7a1a12}50%{background:#e2382a}}
@media (prefers-reduced-motion:reduce){.b.sos.alert{animation:none;background:#e2382a}.b.dir svg{transition:none}}
@media (max-width:620px){.set{grid-template-columns:110px minmax(0,1fr) 36px}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#hud{position:absolute;top:6px;left:12px;right:12px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;white-space:nowrap;overflow:hidden}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;text-align:center}
.hud-left .ars{justify-content:flex-start}
.hud-right .lamps{justify-content:flex-end}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#spd{font-family:var(--mono);font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;min-width:62px}
#spd small{font-size:10px;color:var(--dim);margin-left:3px}
.ars{display:flex;gap:3px}
.ars span{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;background:#101513;color:#3d4a44;border:1px solid #26302c}
.ars span.on{background:#123b26;color:var(--green);border-color:#2a7a4e;box-shadow:0 0 6px rgba(86,214,143,.35)}
.ars span.over{background:#4a1410;color:var(--red);border-color:#a3322a}
.col{display:flex;flex-direction:column;gap:1px;min-width:0}
#pre{font-size:11px;color:var(--amber);min-height:13px}
.st{flex:1;min-width:0}
#stName{font-size:16px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
#stName i{font-style:normal;font-size:11px;padding:0 4px;border-radius:3px;margin-right:5px;color:#fff;vertical-align:2px}
.row{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.lamps{display:flex;gap:4px}
.lamp{font-size:10px;letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:#101513;color:#46524c;border:1px solid #26302c}
.lamp.r{background:#4a1410;color:#ff8b7f;border-color:#a3322a}
.lamp.g{background:#123b26;color:var(--green);border-color:#2a7a4e}
.lamp.a{background:#4a3410;color:var(--amber);border-color:#9c6b20}
#clock{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.hideS{display:none!important}#hud{gap:10px}}
#toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(70%,520px)}
.toast{background:rgba(12,15,14,.88);border:1px solid var(--line);border-left:3px solid var(--amber);padding:4px 9px;border-radius:4px;font-size:14px;text-align:center;transition:opacity .4s}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}.toast.ann{border-left-color:var(--m3);font-style:italic}
#lever{position:absolute;right:16px;top:56px;bottom:56px;width:56px;display:flex;flex-direction:column-reverse;gap:3px;padding:4px}
#lever button{flex:1;min-height:0;border:1px solid #2c3632;border-radius:4px;background:rgba(18,23,21,.9);color:var(--dim);font-family:var(--display);font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:1px}
@media (max-height:600px){#lever button small{display:none}#lever button{font-size:15px}}
#lever button small{font-size:8px;font-weight:500;letter-spacing:.06em;margin-top:2px;opacity:.8;text-transform:uppercase}
#lever button.x{color:#8fd8ac}#lever button.t{color:#efc07a}#lever button.vb{color:#ff8b7f}
#lever button.act{color:#0c0f0e;background:var(--ink);border-color:var(--ink)}
#lever button.act.x{background:var(--green);border-color:var(--green)}
#lever button.act.t{background:var(--amber);border-color:var(--amber)}
#lever button.act.vb{background:var(--red);border-color:var(--red)}
#bar{position:absolute;left:16px;right:16px;bottom:6px;height:42px;display:flex;gap:5px;align-items:center}
#prog{position:relative;flex:1;min-width:70px;height:40px}
#prog .track{position:absolute;left:8px;right:8px;top:14px;height:2px;background:var(--m3);opacity:.7}
#prog .dot{position:absolute;top:11px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--m3);box-sizing:border-box}
#prog .dot.done{background:currentColor}
#prog .nm{position:absolute;top:22px;font-size:10px;color:var(--dim);white-space:nowrap}
#prog .trn{position:absolute;top:8px;width:10px;height:14px;margin-left:-5px;background:var(--amber);border-radius:2px;box-shadow:0 0 8px rgba(243,170,60,.6)}
.b{height:40px;min-width:44px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:var(--glass2);color:var(--ink);font-family:var(--display);font-size:14px;font-weight:600;cursor:pointer;flex:none}
.b.door{min-width:104px;background:#16304f;border-color:#2a5c94;font-size:15px}
.b.door.open{background:#5a2018;border-color:#a3322a}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:active{transform:translateY(1px)}
#ov{position:absolute;inset:0;background:rgba(6,8,8,.88);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:5}
#ov[hidden]{display:none!important}
.card{width:min(860px,100%);background:#171d1b;border:1px solid #2f3a36;border-radius:8px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px}
.card .full{grid-column:1/-1}
@media (max-width:620px){.card{grid-template-columns:minmax(0,1fr)}}
.card h1{margin:0;font-size:30px;line-height:1;text-wrap:balance}
.card h1 span{color:var(--m3)}
.card p{margin:0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.5;color:#c9c4b3;max-width:65ch}
.card img{width:100%;height:auto;display:block}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.routes button{text-align:left;border:1px solid #2f3a36;background:#202825;color:var(--ink);border-radius:6px;padding:7px 9px;cursor:pointer;font-family:var(--display)}
.routes button b{display:block;font-size:16px}
.routes button span{font-size:12px;color:var(--dim)}
.routes button.sel{border-color:var(--m3);box-shadow:inset 0 0 0 1px var(--m3);background:#14263b}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:13px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.go{font-family:var(--display);font-size:20px;font-weight:700;padding:10px;border-radius:6px;border:0;background:var(--amber);color:#1a1205;cursor:pointer}
.help{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:system-ui,sans-serif;font-size:12px;color:#c9c4b3;align-content:start}
.help b{font-family:var(--mono);font-size:11px;color:var(--ink);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;border-bottom:1px solid #2f3a36;text-align:right}
td:first-child,th:first-child{text-align:left;font-family:var(--display);font-size:14px}
th{color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.tblw{overflow:auto;max-height:50vh}
.big{font-family:var(--mono);font-size:38px;font-weight:600}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div id="app">
  <div id="scene"><canvas id="cv"></canvas></div>
  <div id="hud" class="glass">
    <div class="hud-left">
      <div id="spd">0<small>km/h</small></div>
      <div class="ars" id="ars"><span data-v="0">0</span><span data-v="40">40</span><span data-v="60">60</span><span data-v="70">70</span><span data-v="80">80</span></div>
    </div>
    <div class="hud-center">
      <div id="stName">–</div>
      <div class="row" style="gap:8px"><span id="stLbl">–</span><span id="dist"></span><span id="delta"></span></div>
    </div>
    <div class="hud-right">
      <div class="row"><span id="clock">00:00:00</span><span>Pont <b id="score">0</b></span><span class="hideS">Utas <b id="pax">0</b></span></div>
      <div class="lamps"><span class="lamp" id="lDoor">AJTÓ</span><span class="lamp" id="lArs">ARS</span><span class="lamp" id="lVb">VB</span><span class="lamp" id="lDir">ELŐRE</span></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="lever" class="glass"></div>
  <div id="bar">
    <div id="prog" class="glass"></div>
    <button id="bDoor" class="b door">Ajtók nyitása</button>
    <button id="bHorn" class="b">Kürt</button>
    <button id="bDir" class="b dir" aria-label="Irányváltó: előre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h15M12 5.5 18.5 12 12 18.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="dirL">E</span></button>
    <button id="b112" class="b sos" aria-label="112 segélyhívás">112</button>
    <button id="bCam" class="b">Menet</button>
    <button id="bZout" class="b" aria-label="Kicsinyítés">−</button>
    <button id="bZin" class="b" aria-label="Nagyítás">+</button>
    <button id="bMenu" class="b">Menü</button>
    <button id="bQuit" class="b quit">Kilépés</button>
  </div>
  <div id="ov"></div>
</div>

let fbApp=null, fbDb=null, fbReady=false;
function initFirebase(){
  if(fbReady||typeof firebase==='undefined')return Promise.resolve(fbReady);
  try{if(!firebase.apps.length)fbApp=firebase.initializeApp(FIREBASE_CONFIG);else fbApp=firebase.app();fbDb=firebase.database();fbReady=true;}catch(e){fbReady=false}
  return Promise.resolve(fbReady);

function getNick(){try{return localStorage.getItem('m3sim.nick')||''}catch(e){return ''}}
function setNick(n){n=(n||'').trim().slice(0,16);try{localStorage.setItem('m3sim.nick',n)}catch(e){}return n}
function loadBoardLocal(){try{return JSON.parse(localStorage.getItem('m3sim.board')||'[]')}catch(e){return []}}
function saveBoardLocal(b){try{localStorage.setItem('m3sim.board',JSON.stringify(b.slice(0,40)))}catch(e){}}
async function addScore(score,routeName){
  const nick=getNick()||'Névtelen';
  const entry={nick,score:Math.round(score),route:routeName||'',t:Date.now()};
  const local=loadBoardLocal();local.push(entry);local.sort((a,c)=>c.score-a.score);saveBoardLocal(local);
  try{await initFirebase();if(fbReady&&fbDb)await fbDb.ref('scores').push(entry)}catch(e){}
  return local;
}
async function fetchGlobalBoard(limit=30){
  try{await initFirebase();if(!fbReady||!fbDb)return loadBoardLocal();
    const snap=await fbDb.ref('scores').orderByChild('score').limitToLast(limit).once('value');
    const list=[];snap.forEach(c=>list.push(c.val()));list.reverse();
    if(list.length)saveBoardLocal(list);return list;
  }catch(e){return loadBoardLocal()}
}

  const sc=short?0.6:1,P=[0];
  for(let k=1;k<st.length;k++)P.push(P[k-1]+Math.round(st[k-1].d*sc));
  const arr=[0],dep=[35];
  for(let k=1;k<st.length;k++){arr[k]=dep[k-1]+round5((P[k]-P[k-1])/12.5+24);dep[k]=arr[k]+(st[k].b>1.5?35:28)}
  const zones=[],gaps=[];
  for(let k=0;k<st.length;k++){zones.push({a:P[k]-125,b:P[k]+10,l:60});gaps.push({a:P[k]-153,b:P[k]-150.6},{a:P[k]+16,b:P[k]+18.4})}
  for(let k=0;k<st.length-1;k++){const d=P[k+1]-P[k];
    if(d>600){const h=hash(k*7+st.length);const m=P[k]+d*(0.38+0.24*h),len=140+h*120;zones.push({a:m-len/2,b:m+len/2,l:h>0.5?60:70})}
    let x=P[k]+60,j=0;while(true){x+=170+hash(k*13+j++)*260;if(x>P[k+1]-200)break;gaps.push({a:x,b:x+2.3})}}
  gaps.sort((a,b)=>a.a-b.a);

}

function updPax(dt){
  if(S.doorState==='open'){
    for(let i=0;i<S.D.length;i++){const D=S.D[i];D.t-=dt;if(D.t>0)continue;
      if(D.al>0){D.al--;S.onboard--;const p=newPax(S.cur,doorX(i,S.x)+rnd(-.3,.3),.02);p.state='alight';p.td=rnd(.25,.85);

  }

    p.walk=false;

    else if(p.state==='toDoor'){
      const dx=p.tx-p.x,st=p.sp*dt;
      if(Math.abs(dx)>st){p.x+=Math.sign(dx)*st;p.walk=true}else p.x=p.tx;
      if(p.d>.04){p.d=Math.max(.04,p.d-dt*.5);p.walk=true}

    else if(p.state==='alight'){p.walk=true;p.d=Math.min(p.td,p.d+dt*.6);if(p.d>=p.td)p.state='leave'}

function audioUpdate(ebOn){

  tp(A.rollG.gain,.55*Math.pow(k,1.1)*tun);tp(A.rollF.frequency,120+v*55);

/* ---------- fizika és logika ---------- */
function stationAt(x){for(let i=0;i<R.n;i++)if(x>R.P[i]-ST_A&&x<R.P[i]+14)return i;return-1}
function setLever(i){
  i=clamp(i,0,LV.length-1);if(i===S.lever)return;
  if(i===0&&!S.eb&&S.v>1){S.eb=true;if(S.inc)toast('Vészfékezés – indokolt, nincs pontlevonás','good');else{S.score-=40;toast('Vészfékezés! −40 pont','bad')}sPssh(.2);vib(250)}
  if(S.lever<N0&&i>=N0&&S.v<.1)sPssh(.08);
  S.lever=i;sLever();updLever();
}
function step(dt){
  S.t+=dt;
  const kmh=S.v*3.6,lv=LV[S.lever][0],closed=S.doorState==='closed';
  if(S.eb&&S.v===0&&lv!=='VB')S.eb=false;
  const pf=S.v<12?1:Math.pow(12/S.v,0.85);
  let tgt=0;
  if(S.eb||lv==='VB')tgt=-1.6;
  else if(S.ars.act)tgt=-1.15;
  else tgt={T2:-1.15,T1:-.65,'0':0,'1':S.v<10?.42:0,'2':.85*pf,'3':1.15*pf,'4':1.45*pf}[lv];
  if(tgt>0&&!closed)tgt=0;
  if(tgt>0&&S.inc){tgt=0;S.lockT-=dt;if(S.lockT<=0){S.lockT=4;toast('Vészhelyzet – a menet a helyszín biztosításáig nem folytatható','bad')}}
  if(tgt>0&&S.dir<0)tgt=S.v<1.8?.3:0;
  if(tgt>0&&S.v>30.6)tgt=0;
  const rate=tgt<S.aCmd?(S.eb?6:1.8):1.3;
  S.aCmd+=clamp(tgt-S.aCmd,-rate*dt,rate*dt);
  let a=S.aCmd;if(S.v>.01)a-=.012+.0006*S.v*S.v;
  S.v=Math.max(0,S.v+a*dt);
  S.x+=S.dir*S.v*dt;

  // ARS
  const lim=S.dir>0?limitAt(S.x):10;S.lim=lim;
  const over=kmh>lim+1.5;S.ars.over=over;
  if(over){S.ars.t+=dt;if(!S.ars.act&&((S.ars.t>DIFF[cfg.diff].ars&&S.aCmd>-.3)||kmh>lim+8)){S.ars.act=true;S.score-=25;vib([80,60,80]);toast('ARS beavatkozás – túllépted a '+lim+' km/h-t. −25','bad');sPssh(.16)}}
  else S.ars.t=0;
  if(S.ars.act&&kmh<lim-4)S.ars.act=false;
  // kisiklás 93 km/h felett
  if(!S.derailed&&kmh>93){
    S.derailT=(S.derailT||0)+dt*(kmh-91)*.25;
    if(S.derailT>1.8&&Math.random()<dt*.8)triggerDerail();
  }else S.derailT=0;
  if(S.derailed){S.v=Math.max(0,S.v-dt*8);if(S.v<.3){S.v=0;S.derailed.stopped=true;}}

  // vészfék-szikrák
  const ebOn=(S.eb||lv==='VB')&&S.v>.8;S.ebOn=ebOn;
  if(ebOn)emitBrakeSparks(dt);
  // áramszedő-saru ívek a harmadik sínen
  const sh=shoes(),tract=S.aCmd>.15&&S.v>.4;
  sh.forEach((o,i)=>{const s=S.x-o,g=inGap(s);
    if(g&&!S.shoe[i]){S.shoe[i]=true;if(tract)arc(s,.9+Math.random()*.1);else if(S.v>6)arc(s,.3)}
    else if(!g&&S.shoe[i]){S.shoe[i]=false;if(tract)arc(s,.6)}});
  if(tract&&S.v>3&&Math.random()<dt*.3)arc(S.x-pick(sh),rnd(.2,.45));
  updFx(dt);

  // RK kapcsolóhenger kattogás
  if(S.aCmd>.2&&S.v<13&&S.dir>0){S.rk-=dt;if(S.rk<=0){sRk();S.rk=.24+S.v*.03}}
  // sínillesztések
  if(S.v>.3){const ax=axles(),vol=Math.min(1,S.v/12)*.45;ax.forEach((o,i)=>{const idx=Math.floor((S.x-o)/JOINT);if(idx!==S.ax[i]){S.ax[i]=idx;sClack(vol*(1-o/TRAIN_L*.6));bump(i)}})}
  const sv=Math.min(1,S.v/20);
  for(const c of S.car){c.vy+=(-100*c.y-4.8*c.vy+(Math.random()-.5)*6*sv)*dt;c.y+=c.vy*dt;
    c.va+=(-150*(c.a+S.aCmd*.003)-5*c.va+(Math.random()-.5)*.1*sv)*dt;c.a+=c.va*dt}

  for(let i=0;i<R.n;i++)if(!S.spawned[i]&&R.P[i]-S.x<650)spawnStation(i);

  // ajtók
  if(S.doorState==='opening'){S.doors=Math.min(1,S.doors+dt/1.8);if(S.doors>=1)S.doorState='open'}
  else if(S.doorState==='warn'){S.doorT-=dt;if(S.doorT<=0){S.doorState='closing';sDoor(true)}}
  else if(S.doorState==='closing'){S.doors=Math.max(0,S.doors-dt/1.9);if(S.doors<=0){S.doorState='closed';onClosed()}}
  updPax(dt);
  // vészhelyzet: személy a vágányon
  if(!S.inc&&EMERG[cfg.emerg][1]>0&&S.dir>0){const i=S.next;
    if(i>0&&i<R.n-1&&!S.incPlan[i]&&R.P[i]-S.x<330){S.incPlan[i]=true;
      if(S.v>6&&Math.random()<EMERG[cfg.emerg][1]){const c=S.pax.filter(p=>p.st===i&&p.state==='wait'&&p.x>S.x+110&&p.x<S.x+250);if(c.length)startIncident(pick(c),i)}}}
  updIncident(dt);updCrew(dt);

  // indulás
  if(S.cur>=0&&!S.departed[S.cur]&&closed&&S.x-R.P[S.cur]>1.5){
    const late=S.t-R.dep[S.cur];S.departed[S.cur]=true;const lg=S.log.find(l=>l.i===S.cur);

    S.cur=-1;
  }
  // túlfutás
  const nx=S.next;
  if(nx<R.n&&!S.served[nx]&&S.x>R.P[nx]+15){
    S.served[nx]=true;S.next++;S.score-=150;S.log.push({i:nx,miss:true,pts:-150});
    toast('Túlfutás! '+R.st[nx].n+' kimaradt. −150','bad');
    if(nx===R.n-1)S.endT=S.t+2;
  }
  if(S.endT!==null&&S.t>=S.endT&&!S.ended){S.ended=true;showEnd()}
  if(S.cur===R.n-1&&S.doorState==='open'&&S.endT===null&&exchangeDone())S.endT=S.t+3;
  return ebOn;
}
function onClosed(){

  if(left.length){left.forEach(p=>{p.state='wait';p.d=rnd(.2,.5)});const pen=Math.min(30,left.length*3);S.score-=pen;toast(`${left.length} utas lemaradt. −${pen}`,'bad')}

    setTimeout(()=>speak((lc?`Átállás a ${ns.l} vonalra. `:'')+(S.cur+1===R.n-1?`A következő állomás: ${nm}. Végállomás.`:`A következő állomás: ${nm}.`)),900)}

function openDoors(){S.doorState='opening';sDoor(false);updDoorBtn()}
function doorBtn(){
  if(paused||!S)return;aInit();

    if(S.cur===R.n-1)return toast('Végállomás – várd meg, amíg mindenki leszáll');
    S.doorState='warn';S.doorT=2;sBell(2);setTimeout(()=>speak('Kérjük, vigyázzanak, az ajtók záródnak!',true),150);updDoorBtn();return}

function arrive(i,off){

  S.score+=pp+pa;S.log.push({i,late,off,pts:pp+pa});
  toast(`${R.st[i].n}: ${late>=0?'+':'−'}${mmss(late)} · megállás ${ao.toFixed(1)} m · +${pp+pa}`,pp+pa>=120?'good':'');

  const nm=R.st[i].n;setTimeout(()=>speak(i===R.n-1?`${nm}. Végállomás. Kérjük, mindenki szálljon ki.`:`${nm}. ${XFER[nm]||''}`),1200);

function bump(i){const c=S.car[Math.floor(i/4)];if(!c)return;const imp=.11*Math.min(1,S.v/14)*rnd(.6,1.4);c.vy+=imp;c.va+=(i%4>=2?-1:1)*imp*.02}
function startIncident(p,i){
  p.state='fall';p.inc=true;p.ft=0;
  S.inc={p,x:p.x,st:i,phase:'fall',t:0,called:false,ct:0,hit:false,saved:false,hint:2,wt:0};
  toast('VIGYÁZAT! Személy esett a vágányra! Fékezz!','bad');sAlarm();vib([200,100,200]);
}
function updIncident(dt){
  const I=S.inc;if(!I)return;I.t+=dt;
  if(I.phase==='fall'){I.p.ft+=dt;if(I.p.ft>=.9){I.phase='track';I.p.state='track'}}
  if(!I.hit&&!I.saved&&S.dir>0&&S.x>=I.x-.3){
    I.hit=true;if(I.phase==='fall')I.phase='track';I.p.dead=true;S.eb=true;S.score-=200;S.events.push(['Gázolás – '+R.st[I.st].n,-200]);
    S.dark=1.2;sThud();vib(500);toast('Gázolás történt. Hívd a 112-t!','bad');
  }
  if(!I.hit&&!I.saved&&I.phase==='track'&&S.v<.05&&S.x<I.x-.3){I.saved=true;toast('Megálltál a személy előtt! Hívd a 112-t.','good')}
  if(!I.called){I.hint-=dt;if(I.hint<=0){I.hint=7;if(I.phase!=='fall')toast('Vészhelyzet: nyomd meg a 112 gombot!','bad')}}
  else if(I.phase==='track'||I.phase==='fall'){I.ct-=dt;if(I.ct<=0&&I.phase==='track')spawnCrew()}
  if(I.phase==='crew'){I.wt+=dt;
    if(I.hit&&I.wt>=.9&&!S.str){S.str={x:I.x,d:.22,a:1}}

function triggerDerail(){
  if(S.derailed)return;
  S.derailed={t:0,stopped:false,restoring:false};
  S.damage=Math.min(1,S.damage+.65);
  S.v=Math.max(0,S.v*.35);S.flash=.9;S.dark=.4;
  vib([200,100,200,80,150]);
  toast('KISIKLÁS! A szerelvény elhagyta a síneket!','bad');
  try{sPssh(1);setTimeout(()=>sPssh(.8),180)}catch(e){}
  S.car.forEach((c,i)=>{c.a=(i%2?1:-1)*rnd(.25,.55);c.va=rnd(-2,2);c.y+=rnd(-.4,.6)});
  for(let i=0;i<30;i++)arc(S.x-rnd(0,TRAIN_L),rnd(.6,1.4));
}
function call112ForDerail(){
  if(!S.derailed)return false;
  if(S.derailed.restoring){toast('A tűzoltók már úton vannak');return true;}
  S.derailed.restoring=true;S.derailed.rt=0;startSiren();vib(60);
  toast('112 – tűzoltók úton a kisiklott szerelvényhez','ann');
  setTimeout(()=>{S.car.forEach(c=>{c.a*=.3;c.y*=.5});S.derailed=null;toast('A tűzoltók visszaállították a szerelvényt. Sérülések maradtak.','good');},6000);
  return true;
}

function call112(){
  if(!inGame()||paused)return;aInit();
  if(call112ForDerail())return;
  if(!S.inc)return toast('Nincs vészhelyzet – a 112 csak valós vészhelyzetben hívható');
  if(S.inc.called)return toast('A mentők és a tűzoltók már úton vannak');
  S.inc.called=true;S.inc.ct=5;startSiren();vib(60);
  toast('112: mentők és tűzoltók riasztva – érkezés 5 másodperc múlva','good');
}
function spawnCrew(){
  const I=S.inc;I.phase='crew';I.wt=0;
  const mk=(role,ox,d)=>{const c=newPax(-1,I.x+ox*4,d);c.state='crew';c.role=role;c.tx=I.x+ox;c.sp=5;c.h=rnd(1.75,1.9);c.bag=false;c.hair=false;
    if(role==='m'){c.c='#d23a2a';c.stripe='#e9e6b0';c.l='#2a2f3a'}else{c.c='#26324a';c.stripe='#e8d24a';c.helmet='#e7c21c';c.l='#1d2333'}
    S.crew.push(c)};
  mk('m',-1.1,.1);mk('m',1.1,.1);mk('t',-2.7,.4);mk('t',2.7,.4);
  toast('A mentők és a tűzoltók a helyszínen','good');
}
function finishIncident(){
  const I=S.inc,P=R.P[I.st],exit=P-ESC_DX+1;
  S.crew.forEach(c=>{c.leave=true;c.tx=exit;c.sp=1.7;c.lt=0});
  if(S.str)S.str.carry=true;
  if(!I.hit){const p=I.p,pts=I.saved?100:50;p.inc=false;p.state='leave';p.tx=exit;p.d=.2;p.sp=1.5;S.score+=pts;S.events.push(['Életmentés – '+R.st[I.st].n,pts]);toast(`Életmentés! +${pts} pont`,'good')}

  setTimeout(()=>speak('Tájékoztatjuk kedves utasainkat, hogy a forgalom helyreállt.'),600);

function updCrew(dt){
  for(const c of S.crew){const dx=c.tx-c.x,st=c.sp*dt;c.walk=false;
    if(Math.abs(dx)>st){c.x+=Math.sign(dx)*st;c.walk=true}else c.x=c.tx;
    if(c.walk)c.ph+=dt*c.sp*5;
    if(c.leave){c.lt+=dt;if(c.lt>1.6)c.a-=dt*.8;if(c.a<=0)c.dead=true}}
  S.crew=S.crew.filter(c=>!c.dead);
  if(S.str&&S.str.carry){const m=S.crew.filter(c=>c.role==='m');if(m.length){S.str.x=(m[0].x+(m[1]||m[0]).x)/2;S.str.a=m[0].a}else S.str=null}
}
function drawIncident(ppm,platTop,bandR,X){

      ctx.fillStyle='#55524b';ctx.fillRect(sx-1.6*s,platTop+.58*s,3.2*s,Math.max(1.5,.05*s));
      if(p.state==='fall'){const f=clamp(p.ft/.9,0,1),y=platTop+2+(.62*s-2)*f;ctx.save();ctx.translate(sx,y);ctx.rotate(f*1.45);drawPerson({...p,walk:false},0,0,s*.86);ctx.restore()}

/* ---------- QR-kód generátor (bájt mód, M szint, 1–10. verzió) ---------- */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26],NB=[-1,1,1,1,2,2,4,4,4,5,5];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*NB[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const div=n=>{const r=new Array(n).fill(0);r[n-1]=1;let root=1;for(let i=0;i<n;i++){for(let j=0;j<n;j++){r[j]=mul(r[j],root);if(j+1<n)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rem=(d,dv)=>{const r=new Array(dv.length).fill(0);for(const b of d){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  function make(text){
    const bytes=Array.from(new TextEncoder().encode(text));let v=1;while(v<=10&&4+8+bytes.length*8>dataCw(v)*8)v++;if(v>10)throw Error('túl hosszú');
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    const nb=NB[v],el=ECC[v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=div(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=rem(d,dv);if(i<ns)d.push(0);blocks.push(d.concat(e))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i])});
    const size=v*4+17,M=[...Array(size)].map(()=>new Array(size).fill(false)),F=[...Array(size)].map(()=>new Array(size).fill(false));
    const sf=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){sf(6,i,i%2===0);sf(i,6,i%2===0)}
    for(const[cx,cy]of[[3,3],[size-4,3],[3,size-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<size&&y>=0&&y<size)sf(x,y,d!==2&&d!==4)}
    let al=[];if(v>1){const n=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(n*2-2))*2;al=[6];for(let i=0,p=size-7;i<n-1;i++,p-=step)al.splice(1,0,p)}
    al.forEach((a,i)=>al.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
    const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
      for(let i=0;i<8;i++)sf(size-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,size-15+i,g(i));sf(8,size-8,true)};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);sf(a,c,bt);sf(c,a,bt)}}
    let i=0;for(let r=size-1;r>=1;r-=2){if(r===6)r=5;for(let vt=0;vt<size;vt++)for(let j=0;j<2;j++){const x=r-j,up=((r+1)&2)===0,y=up?size-1-vt:vt;if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
    const mk=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&mk[m](x,y))M[y][x]=!M[y][x]};
    const pen=()=>{let p=0,dark=0;for(let y=0;y<size;y++){let rx=1,ry=1;for(let x=0;x<size;x++){if(M[y][x])dark++;
      if(x>0){if(M[y][x]===M[y][x-1]){rx++;if(rx===5)p+=3;else if(rx>5)p++}else rx=1;if(M[x][y]===M[x-1][y]){ry++;if(ry===5)p+=3;else if(ry>5)p++}else ry=1}
      if(x>0&&y>0&&M[y][x]===M[y-1][x]&&M[y][x]===M[y][x-1]&&M[y][x]===M[y-1][x-1])p+=3}}
      return p+Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10};
    let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const q=pen();if(q<bp){bp=q;best=m}apply(m)}
    apply(best);fmt(best);return M}
  return{make}
})();

let last=performance.now();
let audT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!paused){const eb=step(dt);audT-=dt;if(audT<=0){audT=1/25;audioUpdate(eb)}}render(dt);hudT-=dt;if(hudT<=0){updHud();hudT=.08}}
  requestAnimationFrame(frame)}
for(const k in ESC)delete ESC[k];reset();resize();setCam(cam.mode);if(!getNick()) showNickPrompt(showMain); else showMain();requestAnimationFrame(frame);
